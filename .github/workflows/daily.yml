name: daily check-in
on:
  schedule:
    - cron: "0 16 * * *"   # every day 16:00 UTC (8–9am Pacific)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "- $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z') checked in" >> log.md
          git config user.name "joshuatk070304-del"
          git config user.email "290221442+joshuatk070304-del@users.noreply.github.com"
          git add log.md
          git commit -m "check-in $(date -u +%F)"
          git push
